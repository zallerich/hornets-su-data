/* ============================================================
   RESULTATE (swissunihockey.ch via GitHub-Datenspiegel) – Liga-Spielplan/Resultate abrufen
   Die offizielle SwissUnihockey-API (api-v2.swissunihockey.ch) liefert seit Mitte Oktober 2026
   nur noch HTTP 401 und fällt als direkte Datenquelle aus. Workaround (seit 12.11.2026): Claude
   scraped periodisch myapp.swissunihockey.ch für die hinterlegte Liga-ID und schreibt die Spiele
   als JSON in das öffentliche GitHub-Repo "zallerich/hornets-su-data". Die App liest diese Datei
   direkt von raw.githubusercontent.com (CORS-frei, kein Login nötig) als Fallback-Datenquelle.
   Der Trainer hinterlegt pro Saison nur die Liga-ID (z.B. 9656) - sie steht in der Adresse von
   myapp.swissunihockey.ch/league/<ID>/fixtures. Die abgerufenen Spiele werden zusätzlich in
   Firestore gecacht (Sammlung "suGames"), unabhängig von den eigenen Spieltagen/Linienplanung.
   ============================================================ */
const SU_DATA_REPO_BASE = 'https://raw.githubusercontent.com/zallerich/hornets-su-data/main/data';

// Baut aus der Liga-ID die Liga-Verknüpfung (ligaId + Roh-JSON-URL im GitHub-Datenspiegel).
function buildSuSource(ligaIdRaw){
  const ligaId = (ligaIdRaw||'').trim();
  if(!/^\d+$/.test(ligaId)){
    throw new Error('Bitte die Liga-ID als Zahl eingeben (z.B. 9656). Du findest sie in der Adresse von myapp.swissunihockey.ch/league/<ID>/fixtures.');
  }
  const sourceUrl = `${SU_DATA_REPO_BASE}/${ligaId}.json`;
  return { ligaId, sourceUrl };
}

// Formatiert ein enthaltenes Datum (z.B. "13.9.26") auf DD.MM.YYYY,
// z.B. "Runde 1 / 13.9.26" -> "Runde 1 / 13.09.2026". Dient als Fallback, falls eine Rundenangabe
// ausnahmsweise kein reines "N. Meisterschaftsrunde"-Format hat.
function formatSuRoundLabel(label){
  if(!label) return label;
  return label.replace(/(\d{1,2})\.(\d{1,2})\.(\d{2,4})/g, (m, d, mo, y) => {
    d = d.padStart(2,'0');
    mo = mo.padStart(2,'0');
    if(y.length===2) y = '20'+y;
    return `${d}.${mo}.${y}`;
  });
}

// Lädt die komplette (bereits von Claude über die ganze Saison zusammengetragene) Liga-Datei aus
// dem GitHub-Datenspiegel und wandelt sie ins intern verwendete Spiel-Schema um. Ein
// Cache-Busting-Parameter plus {cache:'no-store'} umgeht den Browser-Cache - gegen den kurzzeitigen
// CDN-Cache von raw.githubusercontent.com (bis zu ~1-2 Min. nach einem frischen Commit) hilft das
// nicht; in diesem Fall liefert ein erneuter Abruf etwas später die aktuelle Version.
async function suFetchLeagueData(source){
  const res = await fetch(`${source.sourceUrl}?v=${Date.now()}`, {cache: 'no-store'});
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if(!json || !Array.isArray(json.games)){
    throw new Error('Unerwartetes Datenformat (keine Spieleliste gefunden)');
  }
  // Die GitHub-Daten kennen (anders als die frühere API) keine Team-IDs, dafür aber Runde,
  // Rundenbezeichnung, Datum/Zeit bereits fertig getrennt bzw. aufbereitet - und seit dem
  // 12.11.2026 auch wieder echte Vereinslogo-URLs (homeLogo/awayLogo, stabile Azure-Blob-
  // Storage-Links von swissunihockeysa), die der Scraper direkt aus der Vereinsliga-Tabelle
  // mitextrahiert. Fehlt das Feld (z.B. bei älteren, noch nicht neu gescrapten Datensätzen),
  // fällt es auf einen leeren String zurück statt zu crashen.
  const games = json.games.map(g => ({
    gameId: String(g.gameId),
    round: g.round!=null ? Number(g.round) : null,
    roundLabel: g.roundLabel || (g.round!=null ? `${g.round}. Meisterschaftsrunde` : ''),
    dateText: [g.dateText||'', g.time||''].filter(Boolean).join(' '),
    dateSort: g.dateSort!=null ? Number(g.dateSort) : null,
    location: g.location || '',
    homeTeam: g.homeTeam || '',
    homeTeamId: null,
    homeTeamSub: g.homeTeamSub || '',
    homeLogo: g.homeLogo || '',
    awayTeam: g.awayTeam || '',
    awayTeamId: null,
    awayTeamSub: g.awayTeamSub || '',
    awayLogo: g.awayLogo || '',
    result: g.result || '',
    resultDetail: '',
    updatedAt: Date.now(),
  }));
  return { games, groupLabel: json.groupLabel || '', season: json.season || '' };
}

function suActiveSource(){
  return state.suSource.find(s => s.id === state.activeSeasonId) || null;
}

// Quellenunabhängige "Fingerabdruck"-Signatur für ein reales Spiel (Datum+Zeit+die zwei Teams,
// reihenfolgeunabhängig). Die alte, inzwischen gesperrte SwissUnihockey-API und der seit
// 12.11.2026 verwendete GitHub-Datenspiegel vergeben für dasselbe reale Spiel UNTERSCHIEDLICHE
// gameId-Werte (API: numerische SwissUnihockey-Spiel-ID; GitHub: ein aus Runde/Teams gebildeter
// Text-Slug). Ohne diese Signatur würde die App nach der Umstellung alte (API-Ära) und neue
// (GitHub-Ära) Einträge für ein und dasselbe echte Spiel als zwei verschiedene Spiele behandeln -
// das führte zu doppelten Resultaten, doppelt gezählten Tabellen-Werten und doppelt angelegten
// Spieltagen beim erneuten Importieren. Das eigene Team wird dabei durch ein festes Platzhalter-
// Token ersetzt (statt des vollen, möglicherweise leicht unterschiedlich geschriebenen Vereins-
// namens), damit die Signatur auch über die beiden sehr unterschiedlichen Datenschemata hinweg
// vergleichbar bleibt (siehe suMatchdaySpielSignature unten für Spieltag-interne "Spiel"-Einträge,
// die nur "Gegner"+Anspielzeit statt Heim-/Gast-Team kennen).
function suMatchSignature(dateSort, time, teamA, teamB){
  const norm = s => {
    const t = String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
    return /hornets/.test(t) ? '#eigenes-team#' : t;
  };
  const teams = [norm(teamA), norm(teamB)].sort().join('|');
  return `${dateSort||''}_${time||''}_${teams}`;
}

// suMatchSignature für ein suGames-Objekt (homeTeam/awayTeam/dateText/dateSort vorhanden).
function suGameSignature(g){
  const tm = /(\d{1,2}):(\d{2})\s*$/.exec((g.dateText||'').trim());
  const time = tm ? `${tm[1].padStart(2,'0')}:${tm[2]}` : '';
  return suMatchSignature(g.dateSort, time, g.homeTeam, g.awayTeam);
}

// Sortierschlüssel (numerisch, aufsteigend) für die Resultate-Liste: Datum + Anspielzeit, damit
// Spiele innerhalb eines Spieltags (gleiche Runde, gleiches Datum) nach Uhrzeit statt nach der
// (für den Nutzer bedeutungslosen) gameId sortiert werden. `dateSort` (YYYYMMDD) kommt bei
// automatisch importierten Spielen bereits fertig aus den GitHub-Daten; bei manuell erfassten
// Spielen (dateSort===null) wird das Datum stattdessen aus dem frei eingegebenen `dateText`
// geparst. Die Uhrzeit steht in beiden Fällen am Ende von `dateText` (z.B. "13.09.2026 09:00").
// Spiele ganz ohne auswertbares Datum landen ans Ende, Spiele mit Datum aber ohne Uhrzeit vor
// den Spielen mit Uhrzeit am selben Tag.
function suGameSortKey(g){
  let dateNum = g.dateSort!=null ? Number(g.dateSort) : null;
  if(dateNum==null){
    const dm = /(\d{1,2})\.(\d{1,2})\.(\d{4})/.exec(g.dateText||'');
    if(dm) dateNum = Number(dm[3])*10000 + Number(dm[2])*100 + Number(dm[1]);
  }
  if(dateNum==null) dateNum = 99999999;
  const tm = /(\d{1,2}):(\d{2})\s*$/.exec((g.dateText||'').trim());
  const minutes = tm ? Number(tm[1])*60 + Number(tm[2]) : -1;
  return dateNum*10000 + (minutes>=0 ? minutes : 0);
}

// suMatchSignature für ein einzelnes, bereits in einem Spieltag erfasstes "Spiel" - dieses Schema
// (Data.games) kennt KEIN homeTeam/awayTeam/dateSort, sondern nur `opponent` (Gegner) + `kickoff`
// (Anspielzeit); Datum/Ort stehen stattdessen beim übergeordneten Spieltag (matchday.date). Das
// eigene Team wird hier direkt als Platzhalter eingesetzt (wird von suMatchSignature ohnehin auf
// dasselbe Token normalisiert wie der volle Vereinsname auf der anderen Seite).
function suMatchdaySpielSignature(matchday, spiel){
  const dm = /(\d{1,2})\.(\d{1,2})\.(\d{2,4})/.exec((matchday&&matchday.date)||'');
  let dateSort = '';
  if(dm){
    let d = Number(dm[1]), mo = Number(dm[2]), y = Number(dm[3]);
    if(y < 100) y += 2000;
    dateSort = y*10000 + mo*100 + d;
  }
  return suMatchSignature(dateSort, (spiel.kickoff||'').trim(), 'hornets', spiel.opponent);
}

// Alle für die aktive Saison bereits zwischengespeicherten SwissUnihockey-Spiele. Dedupliziert
// zusätzlich über die quellenunabhängige Signatur (siehe suGameSignature) - bei einem Duplikat
// (gleiches reales Spiel, unterschiedliche gameId aus unterschiedlichen Datenquellen-Epochen)
// gewinnt der zuletzt aktualisierte Eintrag. Betrifft NUR die Anzeige/Berechnung (Resultate,
// Tabelle, Spieltage-Import); bereits in Firestore liegende "verwaiste" Alt-Einträge werden dadurch
// nicht gelöscht, aber auch nicht mehr doppelt angezeigt oder doppelt gezählt.
function suGamesForSeason(){
  const raw = state.suGames.filter(g => g.seasonId === state.activeSeasonId);
  const bySignature = new Map();
  raw.forEach(g => {
    const sig = suGameSignature(g);
    const existing = bySignature.get(sig);
    if(!existing || (g.updatedAt||0) >= (existing.updatedAt||0)) bySignature.set(sig, g);
  });
  return Array.from(bySignature.values());
}

// Importiert noch nicht importierte, künftige eigene Spiele (Hornets) aus SwissUnihockey in den
// Reiter "Spieltage". Bei diesem Format (E-Junioren) finden an einem Spieltag/einer Runde oft
// mehrere eigene Spiele gegen verschiedene Gegner am selben Ort statt - darum wird pro Runde EIN
// Spieltag angelegt, mit je einem vorausgefüllten Spiel (Gegner/Anspielzeit) pro Gegner darin.
// Ein Spieltag wird anhand der Rundennummer (suRound) wiedererkannt; ob ein einzelnes Spiel schon
// erfasst ist, wird NICHT mehr nur über die SwissUnihockey-Spiel-ID (suGameId) geprüft, sondern
// global über alle Spieltage der Saison per quellenunabhängiger Signatur (suMatchSignature,
// Datum+Zeit+Teams) - damit nichts doppelt angelegt wird, auch wenn ein Spiel früher über die
// alte API importiert wurde und jetzt über den GitHub-Datenspiegel eine andere ID trägt. Bereits
// vergangene Spiele werden übersprungen, und manuelles Erfassen von Spieltagen bleibt daneben
// weiterhin möglich.
async function suImportMatchdays(){
  if(!state.activeSeasonId) return;
  const allGames = suGamesForSeason();
  const nowD = new Date();
  const todaySort = nowD.getFullYear()*10000 + (nowD.getMonth()+1)*100 + nowD.getDate();
  const ownFutureGames = allGames.filter(g => {
    if(!g.gameId) return false;
    const isOwn = /hornets/i.test(g.homeTeam||'') || /hornets/i.test(g.awayTeam||'');
    if(!isOwn) return false;
    if(g.dateSort==null || g.dateSort <= todaySort) return false; // nur zukünftige Spiele
    return true;
  });
  if(!ownFutureGames.length){
    await showAlert('Keine neuen, noch nicht importierten künftigen Spiele gefunden.');
    return;
  }

  // Bereits in IRGENDEINEM Spieltag dieser Saison erfasste eigene Spiele einsammeln - global über
  // alle Spieltage, NICHT nur innerhalb des zur Rundennummer passenden Spieltags. Seit dem Wechsel
  // der Datenquelle (siehe suGameSignature) können suGameId UND Rundennummer für ein bereits
  // importiertes Spiel anders lauten als beim erneuten Import - ein Abgleich nur innerhalb des
  // "passenden" Spieltags hat das übersehen und zu doppelt angelegten Spieltagen/Spielen geführt.
  const seasonMatchdays = state.matchdays.filter(x=>x.seasonId===state.activeSeasonId);
  const existingSignatures = new Set();
  for(const md of seasonMatchdays){
    const gs = await Data.games.listOnce(md.id);
    gs.forEach(eg => existingSignatures.add(suMatchdaySpielSignature(md, eg)));
  }
  const newOwnFutureGames = ownFutureGames.filter(g => !existingSignatures.has(suGameSignature(g)));
  if(!newOwnFutureGames.length){
    await showAlert('Keine neuen, noch nicht importierten künftigen Spiele gefunden.');
    return;
  }

  // Nach Runde gruppieren (eine Runde = ein Spieltag, kann mehrere eigene Spiele enthalten).
  const byRound = new Map();
  newOwnFutureGames.forEach(g => {
    const key = g.round!=null ? String(g.round) : `_${g.dateSort}`; // Fallback ohne Rundenangabe
    if(!byRound.has(key)) byRound.set(key, []);
    byRound.get(key).push(g);
  });

  let importedRounds = 0, importedGames = 0;
  const failedRounds = []; // {roundKey, error} - damit ein einzelner Fehler nicht den ganzen Import abbricht
  for(const [roundKey, newGames] of byRound){
    try{
      newGames.sort((a,b) => (a.dateSort||0) - (b.dateSort||0));
      let md = state.matchdays.find(x => x.seasonId===state.activeSeasonId && x.suRound===roundKey);
      let mdId = md ? md.id : null;
      const existingGames = md ? await Data.games.listOnce(mdId) : [];
      if(!newGames.length) continue;

      if(!md){
        const first = newGames[0];
        const roundNum = /^\d+$/.test(roundKey) ? Number(roundKey) : null;
        const title = roundNum!=null ? `${roundNum}. Meisterschaftsrunde` : (formatSuRoundLabel(first.roundLabel) || 'Meisterschaftsrunde');
        const dm = /(\d{1,2})\.(\d{1,2})\.(\d{2,4})/.exec(first.dateText||'');
        let date = '';
        if(dm){
          const d = dm[1].padStart(2,'0'), mo = dm[2].padStart(2,'0');
          let y = dm[3]; if(y.length===2) y = '20'+y;
          date = `${d}.${mo}.${y}`;
        }
        mdId = await Data.matchdays.add({
          title, date,
          location: first.location || '',
          type: 'meisterschaft',
          seasonId: state.activeSeasonId,
          suRound: roundKey,
        });
        importedRounds++;
      }

      let idx = existingGames.length;
      for(const g of newGames){
        const isHomeHornets = /hornets/i.test(g.homeTeam||'');
        const opponent = isHomeHornets ? g.awayTeam : g.homeTeam;
        const tm = /(\d{1,2}):(\d{2})\s*$/.exec((g.dateText||'').trim());
        const kickoff = tm ? `${tm[1].padStart(2,'0')}:${tm[2]}` : '';
        await Data.games.add(mdId, {
          opponent, kickoff, besammlung: '',
          duration: 24, shiftSeconds: 90, fieldCount: 3,
          goalieId: null,
          order: [],
          goalsFor: {}, goalsAgainst: {},
          orderIndex: idx,
          suGameId: String(g.gameId),
        });
        idx++;
        importedGames++;
      }
    }catch(e){
      // Einen fehlgeschlagenen Spieltag NICHT den ganzen Import abbrechen lassen - sonst
      // bleiben alle nachfolgenden Runden komplett unimportiert, ohne dass das sichtbar wird.
      console.error('Import Runde', roundKey, 'fehlgeschlagen:', e);
      failedRounds.push({roundKey, error: (e && e.message) ? e.message : String(e)});
    }
  }

  renderMatchdaysView();
  if(!importedGames && !failedRounds.length){
    await showAlert('Keine neuen, noch nicht importierten künftigen Spiele gefunden.');
  }else{
    let msg = importedGames
      ? `${importedRounds} Spieltag${importedRounds===1?'':'e'} mit insgesamt ${importedGames} Spiel${importedGames===1?'':'en'} aus SwissUnihockey importiert.`
      : 'Keine neuen Spiele importiert.';
    if(failedRounds.length){
      msg += `\n\nAchtung: Bei ${failedRounds.length} Runde${failedRounds.length===1?'':'n'} ist der Import fehlgeschlagen (${failedRounds.map(f=>f.roundKey).join(', ')}). Bitte den Import einfach nochmals ausführen - bereits importierte Spiele werden dabei nicht doppelt angelegt. Fehlermeldung: ${failedRounds[0].error}`;
    }
    await showAlert(msg);
  }
}

// Wandert von der aktuellen Runde aus rückwärts (previous) und vorwärts (next) durch die
// gesamte Saison und sammelt alle Spiele der Liga-Gruppe ein - für die Resultatliste (samt
// Filtern nach Team/Spieltag/Zeitraum) und die berechnete Tabelle (da swissunihockey.ch für
// tiefere Junioren-Stufen keine offizielle Tabelle veröffentlicht).
// Berechnet aus den gesammelten Spielen (nur bereits ausgetragene, d.h. mit Resultat) eine
// Tabelle: 3 Punkte Sieg, 1 Punkt Unentschieden, 0 Punkte Niederlage; sortiert nach Punkten,
// dann Tordifferenz, dann erzielten Toren.
// Eindeutiger Schlüssel für ein Team: bevorzugt die von swissunihockey.ch vergebene Team-ID
// (garantiert eindeutig), nur falls die fehlt (sollte nicht vorkommen) Fallback auf den Namen.
// Wichtig, weil manche Vereine zwei Teams mit identischem Namen führen (z.B. "UHC X" mit den
// Zusätzen "Jun E" / "Jun E Weiss") - eine reine Namens-Zuordnung würde deren Resultate
// fälschlicherweise zu einem einzigen Tabellen-Eintrag zusammenführen.
// Team-IDs stammen ausschliesslich aus der alten, seit Okt. 2026 gesperrten SwissUnihockey-API
// und fehlen bei den seit 12.11.2026 verwendeten GitHub-Daten komplett. Würde man hier (wie
// früher) IDs bevorzugen, bekäme ein und dasselbe Team durch den Quellenwechsel zwei getrennte
// Tabellen-/Filterzeilen (einmal über die alte ID, einmal über Name+Zusatz) - darum wird die ID
// bewusst ignoriert. Name+Zusatz (z.B. "Jun E (Tiger)" vs. "(Bären)") reicht zur Unterscheidung
// von Vereinen mit mehreren E-Junioren-Teams aus und ist quellenunabhängig stabil.
function suTeamKey(id, name, sub){ return `name:${name}|${sub||''}`; }

// Baut für eine Liste von Spielen eine Map "Team-Schlüssel -> Anzeigename". Normalerweise ist
// das einfach der Team-Name; kommt derselbe Name aber bei zwei unterschiedlichen Team-IDs vor
// (z.B. ein Verein mit zwei E-Junioren-Teams "UHC X I" / "UHC X II"), wird zur Unterscheidung
// der Zusatz aus der zweiten Textzeile angehängt, falls vorhanden, sonst notfalls die ID.
// Wird sowohl für die Tabelle als auch für den Team-Filter und die rohe Spieleliste verwendet,
// damit überall konsistent dieselben Anzeigenamen erscheinen.
function suBuildTeamDisplayNames(games){
  const teams = new Map(); // key -> {name, sub}
  games.forEach(g => {
    if(g.homeTeam){ const k = suTeamKey(g.homeTeamId, g.homeTeam, g.homeTeamSub); if(!teams.has(k)) teams.set(k, {name: g.homeTeam, sub: g.homeTeamSub||'', id: g.homeTeamId}); }
    if(g.awayTeam){ const k = suTeamKey(g.awayTeamId, g.awayTeam, g.awayTeamSub); if(!teams.has(k)) teams.set(k, {name: g.awayTeam, sub: g.awayTeamSub||'', id: g.awayTeamId}); }
  });
  const byName = {};
  teams.forEach((t,k) => { (byName[t.name] = byName[t.name]||[]).push({key:k, ...t}); });
  const display = new Map();
  Object.values(byName).forEach(group => {
    group.forEach(t => {
      display.set(t.key, group.length>1 ? (t.sub ? `${t.name} (${t.sub})` : `${t.name} (${t.id||'?'})`) : t.name);
    });
  });
  return display;
}

function suComputeTable(games){
  const teams = {};
  const ensure = (id, name, sub) => {
    if(!name) return null;
    const key = suTeamKey(id, name, sub);
    if(!teams[key]) teams[key] = { key, id, name, sub: sub||'', logo:'', played:0, wins:0, draws:0, losses:0, gf:0, ga:0, points:0 };
    return teams[key];
  };
  games.forEach(g => {
    const m = /^(\d+)\s*:\s*(\d+)/.exec(g.result||'');
    if(!m) return; // noch nicht gespielt / kein Resultat
    const hg = Number(m[1]), ag = Number(m[2]);
    const home = ensure(g.homeTeamId, g.homeTeam, g.homeTeamSub), away = ensure(g.awayTeamId, g.awayTeam, g.awayTeamSub);
    if(!home || !away) return;
    if(!home.logo && g.homeLogo) home.logo = g.homeLogo;
    if(!away.logo && g.awayLogo) away.logo = g.awayLogo;
    home.played++; away.played++;
    home.gf += hg; home.ga += ag;
    away.gf += ag; away.ga += hg;
    if(hg > ag){ home.wins++; home.points += 3; away.losses++; }
    else if(hg < ag){ away.wins++; away.points += 3; home.losses++; }
    else { home.draws++; away.draws++; home.points += 1; away.points += 1; }
  });
  const list = Object.values(teams);
  const displayNames = suBuildTeamDisplayNames(games);
  list.forEach(t => { t.displayName = displayNames.get(t.key) || t.name; t.diff = t.gf - t.ga; });
  list.sort((a,b) => b.points-a.points || b.diff-a.diff || b.gf-a.gf || a.displayName.localeCompare(b.displayName));
  return list;
}

/* ---------- Manuelle Resultat-Erfassung (Ersatz, solange der automatische Import von
   swissunihockey.ch - z.B. wegen einer gesperrten Schnittstelle - nicht funktioniert) ---- */

// Alle bereits bekannten Teams dieser Gruppe (aus zwischengespeicherten Spielen), für die
// Team-Auswahl beim manuellen Erfassen - damit ein manuell erfasstes Spiel mit der exakt
// gleichen Team-ID verknüpft wird wie bereits importierte Spiele (sonst würde das Team in
// der Tabelle als separate Zeile auftauchen statt mit den echten Resultaten verschmolzen zu werden).
function suKnownTeams(){
  const map = new Map();
  suGamesForSeason().forEach(g => {
    if(g.homeTeam){ const k = suTeamKey(g.homeTeamId, g.homeTeam, g.homeTeamSub); if(!map.has(k)) map.set(k, {key:k, id: g.homeTeamId||null, name: g.homeTeam}); }
    if(g.awayTeam){ const k = suTeamKey(g.awayTeamId, g.awayTeam, g.awayTeamSub); if(!map.has(k)) map.set(k, {key:k, id: g.awayTeamId||null, name: g.awayTeam}); }
  });
  return Array.from(map.values()).sort((a,b) => a.name.localeCompare(b.name,'de'));
}

// Resultat eines bereits bekannten Spiels manuell eintragen/korrigieren. Schreibt den vollen,
// bisherigen Datensatz zurück (nicht nur das Feld "result") - im Demo-Modus würde ein reines
// Teil-Update sonst die übrigen Felder (Teams, Datum, ...) überschreiben, da dort anders als in
// Firestore kein echtes merge:true greift. Sobald der automatische Import wieder funktioniert,
// überschreibt er dieses Spiel (gleiche SwissUnihockey-Spiel-ID) ganz automatisch wieder mit dem
// offiziellen Resultat - die manuelle Korrektur muss also später nicht von Hand entfernt werden.
async function editSuGameResult(game){
  const input = await showPrompt(`Resultat für ${game.homeTeam} – ${game.awayTeam}\n(Format z.B. "5:3", leer lassen um das Resultat zu entfernen)`, game.result||'');
  if(input===null) return;
  const trimmed = input.trim();
  if(trimmed && !/^\d+\s*:\s*\d+/.test(trimmed)){
    await showAlert('Bitte das Resultat im Format "Tore Heim:Tore Gast" eingeben, z.B. "5:3".');
    return;
  }
  try{
    await Data.suGames.upsertMany(state.activeSeasonId, [{...game, result: trimmed, manualResult: !!trimmed, updatedAt: Date.now()}]);
  }catch(e){
    await showAlert('Das Resultat konnte nicht gespeichert werden: ' + (e.message || e.code || e));
  }
}

// Ein komplett neues, noch nicht importiertes Spiel manuell erfassen (eigenes Team oder
// Gegner, Datum, Resultat). Bekommt eine eigene, mit "manual-" präfixierte ID, damit es nie
// mit einer echten SwissUnihockey-Spiel-ID kollidiert. Taucht in Zukunft dasselbe Spiel auch im
// automatischen Import auf, entsteht dafür ein zusätzlicher Eintrag (eigene ID) - der manuelle
// Eintrag wird darum in der Liste als "manuell" markiert und lässt sich jederzeit löschen.
function showAddGameModal(knownTeams){
  return new Promise(resolve => {
    const overlay = document.getElementById('modalOverlay');
    const box = document.getElementById('modalBox');
    const teams = knownTeams || suKnownTeams();
    const teamSelectHtml = (id) => `
      <select id="${id}">
        <option value="">– Team wählen –</option>
        ${teams.map((t,i) => `<option value="${i}">${escapeHtml(t.name)}</option>`).join('')}
        <option value="other">Anderes/neues Team…</option>
      </select>
      <input type="text" id="${id}Other" placeholder="Teamname" style="display:none;margin-top:6px;">`;
    box.style.maxWidth = '420px';
    box.innerHTML = `
      <p style="margin-bottom:10px;"><strong>Spiel manuell erfassen</strong></p>
      <div class="field" style="margin-bottom:10px;"><label style="font-size:0.8rem;color:var(--muted,#666);">Heim-Team</label>${teamSelectHtml('mgHome')}</div>
      <div class="field" style="margin-bottom:10px;"><label style="font-size:0.8rem;color:var(--muted,#666);">Gast-Team</label>${teamSelectHtml('mgAway')}</div>
      <div class="field" style="margin-bottom:10px;"><label style="font-size:0.8rem;color:var(--muted,#666);">Resultat (optional, falls schon gespielt)</label><input type="text" id="mgResult" placeholder="z.B. 5:3"></div>
      <div class="field" style="margin-bottom:10px;"><label style="font-size:0.8rem;color:var(--muted,#666);">Datum (optional)</label><input type="text" id="mgDate" placeholder="TT.MM.JJJJ"></div>
      <div class="modalBtnRow">
        <button class="btn ghost" id="modalCancel">Abbrechen</button>
        <button class="btn" id="modalOk">Speichern</button>
      </div>`;
    overlay.style.display = 'flex';
    const wireTeamSelect = (id) => {
      const sel = document.getElementById(id), other = document.getElementById(id+'Other');
      sel.onchange = () => { other.style.display = sel.value==='other' ? 'block' : 'none'; if(sel.value==='other') other.focus(); };
    };
    wireTeamSelect('mgHome');
    wireTeamSelect('mgAway');
    const resolveTeam = (id) => {
      const sel = document.getElementById(id), other = document.getElementById(id+'Other');
      if(sel.value==='other') return other.value.trim() ? { id: null, name: other.value.trim() } : null;
      if(sel.value==='') return null;
      const t = teams[Number(sel.value)];
      return t ? { id: t.id, name: t.name } : null;
    };
    const cleanup = () => { box.style.maxWidth=''; closeModal(); };
    document.getElementById('modalCancel').onclick = () => { cleanup(); resolve(null); };
    document.getElementById('modalOk').onclick = async () => {
      const home = resolveTeam('mgHome'), away = resolveTeam('mgAway');
      if(!home || !away){ await showAlert('Bitte Heim- und Gast-Team angeben.'); return; }
      const result = document.getElementById('mgResult').value.trim();
      if(result && !/^\d+\s*:\s*\d+/.test(result)){ await showAlert('Bitte das Resultat im Format "Tore Heim:Tore Gast" eingeben, z.B. "5:3".'); return; }
      const dateText = document.getElementById('mgDate').value.trim();
      cleanup();
      resolve({
        gameId: 'manual-' + uid(),
        dateText, dateSort: null, location: '',
        homeTeam: home.name, homeTeamId: home.id, homeTeamSub: '', homeLogo: '',
        awayTeam: away.name, awayTeamId: away.id, awayTeamSub: '', awayLogo: '',
        result, resultDetail: '', manualGame: true, updatedAt: Date.now(),
      });
    };
    overlay.onclick = e => { if(e.target===overlay){ cleanup(); resolve(null); } };
  });
}
async function addManualSuGame(){
  const game = await showAddGameModal();
  if(!game) return;
  try{
    await Data.suGames.upsertMany(state.activeSeasonId, [game]);
  }catch(e){
    await showAlert('Das Spiel konnte nicht gespeichert werden: ' + (e.message || e.code || e));
  }
}
async function deleteSuGame(game){
  // Manuell erfasste Spiele sind damit endgültig weg. Automatisch importierte Spiele (von
  // swissunihockey.ch) tauchen dagegen wieder auf, falls sie beim nächsten automatischen
  // Import (Sa/So bzw. "Aktualisieren") weiterhin in der offiziellen Liga-Gruppe gelistet
  // sind - das Entfernen hier ist also vor allem für veraltete/doppelte oder nicht mehr
  // gültige Einträge gedacht, die nicht (mehr) erneut importiert werden.
  const hint = game.manualGame
    ? ''
    : '\n\nHinweis: Ist dieses Spiel weiterhin bei swissunihockey.ch gelistet, erscheint es beim nächsten automatischen Import wieder.';
  if(await showConfirm(`${game.homeTeam} – ${game.awayTeam} wirklich aus der Liste entfernen?${hint}`, 'Entfernen')){
    try{
      await Data.suGames.remove(game.gameId);
    }catch(e){
      await showAlert('Das Spiel konnte nicht gelöscht werden: ' + (e.message || e.code || e));
    }
  }
}

// Lädt die gesamte Saison (alle Runden) neu von swissunihockey.ch, cacht sie in Firestore
// und berechnet daraus die Tabelle. Versorgt sowohl die Resultatliste als auch die Tabelle.
async function suRefreshAll(){
  const source = suActiveSource();
  if(!source) return;
  state.suLoading = true;
  state.suError = null;
  renderResultsView();
  try{
    const { games, groupLabel, season } = await suFetchLeagueData(source);
    state.suTitle = groupLabel + (season ? ` · Saison ${season}` : '');
    state.suLastFetchedAt = Date.now();
    // Die Tabelle wird aus ALLEN bekannten Spielen berechnet (frisch geladene + bereits in
    // Firestore zwischengespeicherte), nicht nur aus dem aktuellen Live-Abruf, damit auch bei
    // einem fehlgeschlagenen Abruf die zuletzt zwischengespeicherten Resultate erhalten bleiben.
    const merged = new Map();
    suGamesForSeason().forEach(g => merged.set(String(g.gameId), g));
    games.forEach(g => merged.set(String(g.gameId), g));
    state.suTable = suComputeTable(Array.from(merged.values()));
    if(games.length){
      await Data.suGames.upsertMany(state.activeSeasonId, games);
    }
    // Liga-Metadaten (Gruppenname, Saison) in der Verknüpfung nachpflegen, damit Reiter-/
    // Kartentitel auch ohne erneuten Abruf (z.B. gleich nach dem Seitenladen) korrekt sind.
    if(groupLabel && (groupLabel!==source.groupLabel || season!==source.season)){
      await Data.suSource.set(state.activeSeasonId, {...source, groupLabel, season});
    }
  }catch(e){
    console.error('Fehler beim Laden der SwissUnihockey-Daten:', e);
    state.suError = 'Die Daten konnten nicht geladen werden (' + (e.message || e) + '). Prüfe deine Internetverbindung oder versuche es später erneut.';
  }finally{
    state.suLoading = false;
    renderResultsView();
  }
}

function renderResultsView(opts){
  opts = opts || {};
  const el = document.getElementById('resultsView');
  if(!el) return;
  if(!state.activeSeasonId){
    el.innerHTML = `<div class="card"><p class="muted">Bitte zuerst eine Saison anlegen bzw. auswählen.</p></div>`;
    return;
  }
  const activeSeason = state.seasons.find(s=>s.id===state.activeSeasonId);
  const source = suActiveSource();

  if(!source){
    el.innerHTML = `
      <div class="card">
        <div class="cardHead"><h2>SwissUnihockey <span class="muted" style="font-weight:400;">– Saison ${escapeHtml(activeSeason?activeSeason.label:'')}</span></h2></div>
        <p class="muted" style="margin-top:-6px;">Zeigt den offiziellen Spielplan &amp; die Resultate eurer Liga-Gruppe direkt an – einmal pro Saison verknüpfen, danach automatisch aktuell.</p>
        <p class="muted">Liga-ID eingeben: Auf <code style="font-size:0.72rem;">myapp.swissunihockey.ch</code> die eigene Liga/Gruppe öffnen – die Zahl in der Adresse <code style="font-size:0.72rem;">myapp.swissunihockey.ch/league/<strong>ID</strong>/fixtures</code> ist die Liga-ID (z.B. 9656).</p>
        <div class="inlineForm">
          <div class="field"><label>Liga-ID</label><input type="text" id="suLigaIdInput" placeholder="z.B. 9656" value="${escapeAttr(state.suLigaIdInput)}"></div>
          <button class="btn" id="suSaveLinkBtn">Verknüpfen</button>
        </div>
        ${state.suError ? `<p style="color:#b3261e;">${escapeHtml(state.suError)}</p>` : ''}
      </div>
    `;
    const ligaIdInput = el.querySelector('#suLigaIdInput');
    ligaIdInput.oninput = e => { state.suLigaIdInput = e.target.value; };
    ligaIdInput.onkeydown = e => { if(e.key==='Enter') el.querySelector('#suSaveLinkBtn').click(); };
    el.querySelector('#suSaveLinkBtn').onclick = async () => {
      try{
        const parsed = buildSuSource(document.getElementById('suLigaIdInput').value);
        state.suError = null;
        await Data.suSource.set(state.activeSeasonId, parsed);
        state.suLigaIdInput = '';
        state.suTable = null;
        state.suLastFetchedAt = null;
        state.suFilters = { team: '', round: '', timeframe: '', tableRound: '' };
        updateResultsNavLabel();
        suRefreshAll();
      }catch(e){
        state.suError = e.message || String(e);
        renderResultsView();
      }
    };
    return;
  }

  if(opts.refresh && !state.suLoading && state.suLastFetchedAt===null){
    suRefreshAll();
  }

  const f = state.suFilters || (state.suFilters = { team: '', round: '', timeframe: '', tableRound: '' });
  const allGames = suGamesForSeason();
  // Team-Liste für den Filter: nach Team-ID (nicht nur Name) eindeutig, damit zwei gleichnamige
  // Teams desselben Vereins (z.B. "Jun E" / "Jun E Weiss") nicht zu einer Auswahl verschmelzen.
  const suTeamDisplayNames = suBuildTeamDisplayNames(allGames);
  const teamKeys = new Set();
  allGames.forEach(g => {
    if(g.homeTeam) teamKeys.add(suTeamKey(g.homeTeamId, g.homeTeam, g.homeTeamSub));
    if(g.awayTeam) teamKeys.add(suTeamKey(g.awayTeamId, g.awayTeam, g.awayTeamSub));
  });
  const teams = Array.from(teamKeys)
    .map(key => ({ key, label: suTeamDisplayNames.get(key) || key }))
    .sort((a,b) => a.label.localeCompare(b.label));
  const rounds = Array.from(new Set(allGames.map(g => g.round).filter(r => r!=null && r!=='')));
  rounds.sort((a,b) => Number(a)-Number(b));
  const roundLabelFor = (r) => { const g = allGames.find(x=>String(x.round)===String(r)); return formatSuRoundLabel((g && g.roundLabel) || `Runde ${r}`); };
  const groupLabel = suGroupLabel(source) || 'SwissUnihockey';

  const nowD = new Date();
  const todaySort = nowD.getFullYear()*10000 + (nowD.getMonth()+1)*100 + nowD.getDate();

  let games = allGames.slice();
  if(f.team) games = games.filter(g => suTeamKey(g.homeTeamId, g.homeTeam, g.homeTeamSub)===f.team || suTeamKey(g.awayTeamId, g.awayTeam, g.awayTeamSub)===f.team);
  if(f.round) games = games.filter(g => String(g.round)===String(f.round));
  if(f.timeframe==='past') games = games.filter(g => g.dateSort!=null && g.dateSort <= todaySort);
  if(f.timeframe==='future') games = games.filter(g => g.dateSort!=null && g.dateSort > todaySort);
  games.sort((a,b) => (Number(a.round)||0) - (Number(b.round)||0) || suGameSortKey(a) - suGameSortKey(b));

  // Tabelle: standardmässig der aktuelle Gesamtstand (state.suTable, vom letzten Refresh); bei
  // gewählter Runde wird die Entwicklung bis zu dieser Runde live aus den Spielen neu berechnet.
  const tableRound = f.tableRound || '';
  const displayTable = tableRound
    ? suComputeTable(allGames.filter(g => g.round!=null && Number(g.round) <= Number(tableRound)))
    : state.suTable;

  el.innerHTML = `
    <div class="card">
      <div class="cardHead">
        <h3>Tabelle <span class="muted" style="font-weight:400;">– von der App berechnet</span></h3>
        <div class="field" style="margin:0;"><label>Entwicklung</label>
          <select id="suTableRoundFilter">
            <option value="">Aktuell (ganze Saison)</option>
            ${rounds.map(r=>`<option value="${r}" ${String(f.tableRound)===String(r)?'selected':''}>Nach Runde ${escapeHtml(String(r))}</option>`).join('')}
          </select>
        </div>
      </div>
      <p class="muted" style="margin-top:-6px;">Swiss Unihockey veröffentlicht für diese Stufe keine offizielle Tabelle – sie wird daher aus allen gespielten Resultaten der Saison berechnet (3 Punkte Sieg, 1 Punkt Unentschieden), unabhängig von den Filtern bei den Resultaten.</p>
      ${displayTable && displayTable.length ? `
        <div style="overflow-x:auto;">
        <table><thead><tr><th>#</th><th>Team</th><th>Sp</th><th>S</th><th>U</th><th>N</th><th>Tore</th><th>Diff</th><th>Pkt</th></tr></thead>
        <tbody>${displayTable.map((t,i) => `
          <tr${/hornets/i.test(t.name)?' class="suOwnTeam"':''}>
            <td>${i+1}</td>
            <td><div style="display:flex;align-items:center;gap:6px;">${t.logo ? `<img src="${escapeAttr(t.logo)}" alt="" class="suTeamLogo">` : ''}<span>${escapeHtml(t.displayName||t.name)}</span></div></td>
            <td>${t.played}</td>
            <td>${t.wins}</td>
            <td>${t.draws}</td>
            <td>${t.losses}</td>
            <td>${t.gf}:${t.ga}</td>
            <td>${t.diff>0?'+':''}${t.diff}</td>
            <td><strong>${t.points}</strong></td>
          </tr>`).join('')}</tbody></table>
        </div>
      ` : (state.suLoading ? '<p class="muted">Tabelle wird berechnet…</p>' : '<p class="muted">Noch keine gespielten Spiele gefunden.</p>')}
    </div>

    <div class="card">
      <div class="cardHead">
        <h2>${escapeHtml(groupLabel)}</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn ghost" id="suAddGameBtn">+ Spiel erfassen</button>
          <button class="btn ghost" id="suRefreshBtn" ${state.suLoading?'disabled':''}>${state.suLoading?'Lädt…':'Aktualisieren'}</button>
        </div>
      </div>
      <p class="muted" style="margin-top:-6px;">${escapeHtml(state.suTitle||'')}${state.suTitle ? ' – ' : ''}Importiert von SwissUnihockey${state.suLastFetchedAt ? ` · zuletzt aktualisiert ${escapeHtml(new Date(state.suLastFetchedAt).toLocaleString('de-CH'))}` : ''}</p>
      ${state.suError ? `<p style="color:#b3261e;">${escapeHtml(state.suError)}<br>Funktioniert der automatische Import gerade nicht, können Resultate oben über "+ Spiel erfassen" bzw. direkt in der Liste unten manuell eingetragen werden.</p>` : ''}
      <div class="inlineForm filterBar" style="margin-bottom:14px;">
        <div class="field"><label>Team</label><select id="suFilterTeam"><option value="">Alle Teams</option>${teams.map(t=>`<option value="${escapeAttr(t.key)}" ${f.team===t.key?'selected':''}>${escapeHtml(t.label)}</option>`).join('')}</select></div>
        <div class="field"><label>Spieltag</label><select id="suFilterRound"><option value="">Alle Spieltage</option>${rounds.map(r=>`<option value="${r}" ${String(f.round)===String(r)?'selected':''}>${escapeHtml(roundLabelFor(r))}</option>`).join('')}</select></div>
        <div class="field"><label>Zeitraum</label><select id="suFilterTimeframe">
          <option value="">Alle</option>
          <option value="past" ${f.timeframe==='past'?'selected':''}>Vergangen (inkl. heute)</option>
          <option value="future" ${f.timeframe==='future'?'selected':''}>Zukunft</option>
        </select></div>
      </div>
      ${games.length ? `
        <div style="overflow-x:auto;">
        <table><thead><tr><th>Datum / Zeit</th><th>Ort</th><th>Heim</th><th>Gast</th><th>Resultat</th><th></th></tr></thead>
        <tbody>${games.map(g => `
          <tr data-gid="${escapeAttr(String(g.gameId))}">
            <td>${escapeHtml(g.dateText)}</td>
            <td>${escapeHtml(g.location)}</td>
            <td>${escapeHtml(suTeamDisplayNames.get(suTeamKey(g.homeTeamId, g.homeTeam, g.homeTeamSub)) || g.homeTeam)}</td>
            <td>${escapeHtml(suTeamDisplayNames.get(suTeamKey(g.awayTeamId, g.awayTeam, g.awayTeamSub)) || g.awayTeam)}</td>
            <td>${g.result?escapeHtml(g.result):'<span class="muted">–</span>'}${(g.manualGame||g.manualResult) ? ' <span class="muted" style="font-size:0.72rem;">(manuell)</span>' : ''}</td>
            <td style="white-space:nowrap;">
              <button class="btn ghost suEditResultBtn" title="Resultat bearbeiten" style="padding:2px 8px;font-size:0.8rem;">✎</button>
              <button class="btn ghost suDeleteGameBtn" title="Spiel entfernen" style="padding:2px 8px;font-size:0.8rem;">✕</button>
            </td>
          </tr>`).join('')}</tbody></table>
        </div>
      ` : (state.suLoading ? '<p class="muted">Lädt…</p>' : '<p class="muted">Keine Spiele gefunden (evtl. Filter anpassen).</p>')}
      <div style="margin-top:14px;">
        <button class="btn ghost" id="suChangeLinkBtn">Verknüpfung ändern</button>
      </div>
    </div>
  `;

  el.querySelector('#suRefreshBtn').onclick = () => suRefreshAll();
  el.querySelector('#suAddGameBtn').onclick = () => addManualSuGame();
  el.querySelectorAll('.suEditResultBtn').forEach(btn => {
    btn.onclick = () => {
      const gid = btn.closest('tr').dataset.gid;
      const game = games.find(g => String(g.gameId)===gid);
      if(game) editSuGameResult(game);
    };
  });
  el.querySelectorAll('.suDeleteGameBtn').forEach(btn => {
    btn.onclick = () => {
      const gid = btn.closest('tr').dataset.gid;
      const game = games.find(g => String(g.gameId)===gid);
      if(game) deleteSuGame(game);
    };
  });
  el.querySelector('#suFilterTeam').onchange = e => { state.suFilters.team = e.target.value; renderResultsView(); };
  el.querySelector('#suFilterRound').onchange = e => { state.suFilters.round = e.target.value; renderResultsView(); };
  el.querySelector('#suFilterTimeframe').onchange = e => { state.suFilters.timeframe = e.target.value; renderResultsView(); };
  el.querySelector('#suTableRoundFilter').onchange = e => { state.suFilters.tableRound = e.target.value; renderResultsView(); };
  el.querySelector('#suChangeLinkBtn').onclick = async () => {
    if(await showConfirm('Verknüpfung zu swissunihockey.ch für diese Saison entfernen? (Bereits gespeicherte Resultate bleiben erhalten.)', 'Entfernen')){
      await Data.suSource.remove(state.activeSeasonId);
      state.suTitle = null;
      state.suTable = null;
      state.suLastFetchedAt = null;
      state.suFilters = { team: '', round: '', timeframe: '', tableRound: '' };
      updateResultsNavLabel();
      renderResultsView();
    }
  };
}

/* ============================================================
   Helpers
   ============================================================ */
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
</script>
