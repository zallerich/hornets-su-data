/* ---- Datum "TT.MM.JJJJ" in einen sortierbaren Zeitstempel umwandeln (undatierte Spieltage ans Ende) ---- */
function parseMdDate(dateStr){
  if(!dateStr) return null;
  const m = String(dateStr).trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);
  if(!m) return null;
  let [, d, mo, y] = m;
  if(y.length===2) y = '20'+y;
  const t = new Date(Number(y), Number(mo)-1, Number(d)).getTime();
  return isNaN(t) ? null : t;
}
function startOfToday(){
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime();
}
// Ein Spieltag gilt als "nicht in der Zukunft", wenn sein Datum heute oder früher ist,
// oder gar kein Datum erfasst wurde (dann kann nicht beurteilt werden, ob er in der
// Zukunft liegt - lieber mitzählen, als Daten ohne Datum stillschweigend zu verlieren).
function isMatchdayNotFuture(md){
  const t = parseMdDate(md.date);
  return t===null || t <= startOfToday();
}
// Zeitraum-Filter ('', 'past', 'future') für die Saisonübersicht: 'past' = heute oder früher
// (inkl. undatierter Spieltage, siehe isMatchdayNotFuture), 'future' = das Gegenteil.
function matchdayMatchesTimeFilter(md, timeFilter){
  if(!timeFilter) return true;
  const notFuture = isMatchdayNotFuture(md);
  return timeFilter==='past' ? notFuture : !notFuture;
}
function sortMatchdaysChronological(mds){
  return mds.slice().sort((a,b) => {
    const ta = parseMdDate(a.date), tb = parseMdDate(b.date);
    if(ta===null && tb===null) return 0;
    if(ta===null) return 1;  // undatierte Spieltage ans Ende
    if(tb===null) return -1;
    return ta - tb; // chronologisch aufsteigend
  });
}
function sortEvalRoundsChronological(rounds){
  // Wie sortMatchdaysChronological, aber mit Fallback auf den Erstellzeitpunkt
  // (createdAt), wenn Datum fehlt oder gleich ist – so bleibt "1./letzte Runde"
  // auch ohne erfasstes Datum in der richtigen (Erstell-)Reihenfolge.
  return rounds.slice().sort((a,b) => {
    const ta = parseMdDate(a.date), tb = parseMdDate(b.date);
    if(ta!==null && tb!==null && ta!==tb) return ta - tb;
    if(ta!==null && tb===null) return -1;
    if(ta===null && tb!==null) return 1;
    return (a.createdAt||0) - (b.createdAt||0);
  });
}
function distinctOpponents(seasonMds){
  const set = new Set();
  seasonMds.forEach(md => (state.gamesByMatchday[md.id]||[]).forEach(g => { if(g.opponent) set.add(g.opponent); }));
  return Array.from(set).sort((a,b)=>a.localeCompare(b));
}

/* ============================================================
   Mehrfachauswahl-Dropdown für Spieltage (Saisonübersicht):
   [] = "alle" (kanonisch, Standardzustand), ['__NONE__'] = explizit "keine" -
   diese Sentinel unterscheidet "kein Filter gesetzt" von "bewusst alles abgewählt",
   ohne die bestehende Filterlogik (!arr.length || arr.includes(id)) anfassen zu müssen.
   ============================================================ */
const MD_MULTI_NONE = '__NONE__';
function isMdChecked(id, selectedIds){
  if(selectedIds.length===0) return true;
  if(selectedIds.length===1 && selectedIds[0]===MD_MULTI_NONE) return false;
  return selectedIds.includes(id);
}
function mdMultiSummary(selectedIds, seasonMds){
  if(selectedIds.length===0) return 'Alle Spieltage';
  if(selectedIds.length===1 && selectedIds[0]===MD_MULTI_NONE) return 'Keine Spieltage';
  if(selectedIds.length===1){
    const md = seasonMds.find(m=>m.id===selectedIds[0]);
    return md ? (md.title||'Spieltag') : '1 Spieltag';
  }
  return `${selectedIds.length} Spieltage ausgewählt`;
}
function renderMdMultiSelectField(id, label, seasonMds, selectedIds, isOpen){
  const summary = mdMultiSummary(selectedIds, seasonMds);
  const optionsHtml = seasonMds.length ? seasonMds.map(md => `
    <label class="msOption">
      <input type="checkbox" data-md-id="${md.id}" ${isMdChecked(md.id, selectedIds)?'checked':''}>
      <span>${escapeHtml(md.title||'Spieltag')}${md.date?' ('+escapeHtml(md.date)+')':''}</span>
    </label>`).join('') : '<p class="muted" style="margin:4px 0;">Keine Spieltage vorhanden.</p>';
  return `
    <div class="field">
      <label>${escapeHtml(label)}</label>
      <details class="msWrap" id="${id}Details" ${isOpen?'open':''}>
        <summary class="msToggle">${escapeHtml(summary)}</summary>
        <div class="msPanel">
          ${seasonMds.length ? `<div class="msPanelActions">
            <button type="button" class="msActionBtn" data-msact="all">Alle auswählen</button>
            <button type="button" class="msActionBtn" data-msact="none">Alle abwählen</button>
          </div>` : ''}
          <div class="msPanelList">${optionsHtml}</div>
        </div>
      </details>
    </div>`;
}
// Verdrahtet ein per renderMdMultiSelectField erzeugtes Dropdown: Checkboxen, Alle/Keine-Buttons
// und das Offen/Geschlossen-Tracking (damit es beim Neu-Rendern nach einem Klick offen bleibt).
function wireMdMultiSelect(root, id, seasonMds, stateKey, openKey, rerenderFn){
  const details = root.querySelector('#'+id+'Details');
  if(!details) return;
  details.addEventListener('toggle', () => { state.auswertung[openKey] = details.open; });
  const allIds = seasonMds.map(md=>md.id);
  details.querySelectorAll('input[data-md-id]').forEach(cb => {
    cb.onchange = () => {
      let arr = state.auswertung[stateKey];
      if(arr.length===0) arr = allIds.slice();
      else if(arr.length===1 && arr[0]===MD_MULTI_NONE) arr = [];
      else arr = arr.slice();
      const mdId = cb.dataset.mdId;
      if(cb.checked){ if(!arr.includes(mdId)) arr.push(mdId); }
      else { arr = arr.filter(x=>x!==mdId); }
      if(arr.length === allIds.length) arr = [];
      else if(arr.length === 0) arr = [MD_MULTI_NONE];
      state.auswertung[stateKey] = arr;
      state.auswertung[openKey] = true;
      rerenderFn();
    };
  });
  const allBtn = details.querySelector('[data-msact="all"]');
  if(allBtn) allBtn.onclick = (e) => { e.preventDefault(); state.auswertung[stateKey] = []; state.auswertung[openKey] = true; rerenderFn(); };
  const noneBtn = details.querySelector('[data-msact="none"]');
  if(noneBtn) noneBtn.onclick = (e) => { e.preventDefault(); state.auswertung[stateKey] = allIds.length ? [MD_MULTI_NONE] : []; state.auswertung[openKey] = true; rerenderFn(); };
}

function renderAuswertungView(){
  const el = document.getElementById('auswertungView');
  if(!el) return;

  if(!state.activeSeasonId){
    el.innerHTML = `<div class="card"><p class="muted">Bitte oben zuerst eine Saison anlegen bzw. auswählen.</p></div>`;
    return;
  }
  ensureAllGamesWatched();

  const activeSeason = state.seasons.find(s=>s.id===state.activeSeasonId);
  const seasonLabel = activeSeason ? activeSeason.label : '–';
  const seasonMds = sortMatchdaysChronological(state.matchdays.filter(md => md.seasonId===state.activeSeasonId));
  const opponents = distinctOpponents(seasonMds);
  const af = state.auswertung;

  /* ---- Ergebnisse, gefiltert nach Spieltag(en) / Zeitraum / Gegner, unterteilt nach Typ ---- */
  const resultsEntries = [];
  seasonMds.forEach(md => {
    if(af.resultsMatchdays.length && !af.resultsMatchdays.includes(md.id)) return;
    if(!matchdayMatchesTimeFilter(md, af.resultsTimeFilter)) return;
    (state.gamesByMatchday[md.id]||[]).forEach(g => {
      if(af.resultsOpponent && g.opponent !== af.resultsOpponent) return;
      resultsEntries.push({md, game:g});
    });
  });
  function resultsList(type){
    const list = resultsEntries.filter(e => (e.md.type||'meisterschaft')===type);
    if(!list.length) return '<p class="muted">Keine Ergebnisse.</p>';
    return `<div class="scoreLines">` + list.map(({md,game}) => {
      const sc = gameScore(game);
      return `<div class="scoreLine" data-md="${md.id}" data-game="${game.id}" title="Spieltag öffnen"><span>${escapeHtml(md.date||'')}${md.date?' · ':''}${escapeHtml(md.title||'Spieltag')} – ${escapeHtml(game.opponent||'Gegner')}</span><span>${sc.for} : ${sc.against}</span></div>`;
    }).join('') + `</div>`;
  }

  /* ---- Spieler- & Positionsstatistik, gefiltert nach Spieltag(en) / Zeitraum / Typ / Gegner ---- */
  const statsGames = seasonMds
    .filter(md => !af.statsMatchdays.length || af.statsMatchdays.includes(md.id))
    .filter(md => matchdayMatchesTimeFilter(md, af.statsTimeFilter))
    .filter(md => !af.statsType || (md.type||'meisterschaft')===af.statsType)
    .flatMap(md => (state.gamesByMatchday[md.id]||[]).filter(g => !af.statsOpponent || g.opponent===af.statsOpponent));

  const minutesByPlayer = {};
  const gameCountByPlayer = {};
  statsGames.forEach(g => {
    const m = computeMinutesForGame(g);
    Object.entries(m).forEach(([id,min]) => {
      minutesByPlayer[id] = (minutesByPlayer[id]||0) + min;
      if(min>0) gameCountByPlayer[id] = (gameCountByPlayer[id]||0) + 1;
    });
  });
  const goalTotals = computeGoalStatsMulti(statsGames);
  const positionTotals = computePositionMinutesMulti(statsGames);
  const trioStatsRaw = computeTrioStats(statsGames);
  const goalieStatsRaw = computeGoalieStats(statsGames);
  const teammateStatsRaw = computeTeammateStats(statsGames, af.statsPlayer);

  const statPlayers = state.players.filter(p => p.seasonId===state.activeSeasonId);
  const rows = statPlayers.map(p => ({
    p,
    games: gameCountByPlayer[p.id]||0,
    minutes: minutesByPlayer[p.id]||0,
    goals: (goalTotals[p.id]||{}).goals||0,
    plus: (goalTotals[p.id]||{}).plus||0,
    minus: (goalTotals[p.id]||{}).minus||0,
    plusMinus: (goalTotals[p.id]||{}).plusMinus||0,
  })).sort((a,b) => b.minutes-a.minutes || b.games-a.games);

  const displayRows = af.statsPlayer ? rows.filter(r => r.p.id === af.statsPlayer) : rows;

  const statsSort = getSort('auswStats', 'minutes', 'desc');
  const sortedStatsRows = applySort(displayRows, statsSort, {
    name: r => r.p.name, games: r => r.games, minutes: r => r.minutes, goals: r => r.goals, plus: r => r.plus, minus: r => r.minus, plusMinus: r => r.plusMinus,
  });
  const statsTable = statsGames.length && sortedStatsRows.length ? `
    <table id="auswStatsTable"><thead><tr>
      ${tableHeaderCell(statsSort,'name','Spieler',{defaultDir:'asc'})}
      ${tableHeaderCell(statsSort,'games','Spiele',{width:'70px'})}
      ${tableHeaderCell(statsSort,'minutes','Minuten',{width:'90px'})}
      ${tableHeaderCell(statsSort,'goals','Tore',{width:'70px'})}
      ${tableHeaderCell(statsSort,'plusMinus','+/-',{width:'70px'})}
      ${tableHeaderCell(statsSort,'plus','+',{width:'60px'})}
      ${tableHeaderCell(statsSort,'minus','-',{width:'60px'})}
    </tr></thead>
    <tbody>${sortedStatsRows.map(r => `<tr><td>${escapeHtml(r.p.name)}${r.p.isGuest?' <span class="guestTag">Gast</span>':''}</td><td>${r.games}</td><td>${r.minutes.toFixed(1)}</td><td>${r.goals}</td><td class="${r.plusMinus>0?'plusVal':r.plusMinus<0?'minusVal':''}">${r.plusMinus>0?'+':''}${r.plusMinus}</td><td>${r.plus}</td><td>${r.minus}</td></tr>`).join('')}</tbody></table>
  ` : '<p class="muted">Keine Spiele für diese Filterauswahl.</p>';

  const posCols = ['V','M','S','TW'];
  const posColLabel = {V:'V', M:'M', S:'S', TW:'TW'};
  const posSort = getSort('auswPos', 'V', 'desc');
  const posAccessors = { name: r => r.p.name };
  posCols.forEach(c => { posAccessors[c] = r => (positionTotals[r.p.id]||{})[c] || 0; });
  const sortedPosRows = applySort(displayRows, posSort, posAccessors);
  const posTable = statsGames.length && sortedPosRows.length ? `
    <table id="auswPosTable"><thead><tr>
      ${tableHeaderCell(posSort,'name','Spieler',{defaultDir:'asc'})}
      ${posCols.map(c=>tableHeaderCell(posSort,c,posColLabel[c],{width:'90px'})).join('')}
    </tr></thead>
    <tbody>${sortedPosRows.map(r => {
      const pm = positionTotals[r.p.id]||{};
      return `<tr><td>${escapeHtml(r.p.name)}${r.p.isGuest?' <span class="guestTag">Gast</span>':''}</td>${posCols.map(c=>`<td>${(pm[c]||0).toFixed(1)}</td>`).join('')}</tr>`;
    }).join('')}</tbody></table>
  ` : '<p class="muted">Keine Spiele für diese Filterauswahl.</p>';

  /* ---- +/- Bilanz der 3er-Teams ---- */
  const trioRowsAll = trioStatsRaw
    .filter(t => !af.statsPlayer || t.ids.includes(af.statsPlayer))
    .map(t => {
      const trioPlayers = t.ids.map(id => state.players.find(p=>p.id===id)).filter(Boolean).sort((a,b)=>(a.number||0)-(b.number||0));
      const label = trioPlayers.map(p=>p.name).join(' / ') || '–';
      return { ids: t.ids, label, shifts: t.shifts, minutes: t.minutes, goalsFor: t.goalsFor, goalsAgainst: t.goalsAgainst, plusMinus: t.plusMinus };
    });
  const trioSort = getSort('auswTrio', 'plusMinus', 'desc');
  const sortedTrioRows = applySort(trioRowsAll, trioSort, {
    team: r => r.label, shifts: r => r.shifts, minutes: r => r.minutes, goalsFor: r => r.goalsFor, goalsAgainst: r => r.goalsAgainst, plusMinus: r => r.plusMinus,
  });
  const trioTable = statsGames.length && sortedTrioRows.length ? `
    <table id="auswTrioTable"><thead><tr>
      ${tableHeaderCell(trioSort,'team','3er-Team',{defaultDir:'asc'})}
      ${tableHeaderCell(trioSort,'shifts','Einsätze',{width:'80px'})}
      ${tableHeaderCell(trioSort,'minutes','Minuten',{width:'90px'})}
      ${tableHeaderCell(trioSort,'plusMinus','+/-',{width:'70px'})}
      ${tableHeaderCell(trioSort,'goalsFor','+',{width:'60px'})}
      ${tableHeaderCell(trioSort,'goalsAgainst','-',{width:'60px'})}
    </tr></thead>
    <tbody>${sortedTrioRows.map(r => `<tr><td>${escapeHtml(r.label)}</td><td>${r.shifts}</td><td>${r.minutes.toFixed(1)}</td><td class="${r.plusMinus>0?'plusVal':r.plusMinus<0?'minusVal':''}">${r.plusMinus>0?'+':''}${r.plusMinus}</td><td>${r.goalsFor}</td><td>${r.goalsAgainst}</td></tr>`).join('')}</tbody></table>
  ` : '<p class="muted">Keine Spiele für diese Filterauswahl.</p>';

  /* ---- Gegentore pro Spiel (TW) ---- */
  const goalieRowsAll = Object.entries(goalieStatsRaw)
    .filter(([id]) => !af.statsPlayer || id === af.statsPlayer)
    .map(([id, s]) => {
      const p = state.players.find(x => x.id === id);
      return { p, id, games: s.games, goalsAgainst: s.goalsAgainst, shutouts: s.shutouts, avg: s.games ? s.goalsAgainst / s.games : 0 };
    })
    .filter(r => r.p);
  const goalieSort = getSort('auswGoalie', 'avg', 'asc');
  const sortedGoalieRows = applySort(goalieRowsAll, goalieSort, {
    name: r => r.p.name, games: r => r.games, goalsAgainst: r => r.goalsAgainst, shutouts: r => r.shutouts, avg: r => r.avg,
  });
  const goalieTable = statsGames.length && sortedGoalieRows.length ? `
    <table id="auswGoalieTable"><thead><tr>
      ${tableHeaderCell(goalieSort,'name','Spieler',{defaultDir:'asc'})}
      ${tableHeaderCell(goalieSort,'games','Spiele (TW)',{width:'110px'})}
      ${tableHeaderCell(goalieSort,'goalsAgainst','Gegentore',{width:'90px'})}
      ${tableHeaderCell(goalieSort,'avg','Ø Gegentore/Spiel',{width:'130px'})}
      ${tableHeaderCell(goalieSort,'shutouts','Shutouts',{width:'90px'})}
    </tr></thead>
    <tbody>${sortedGoalieRows.map(r => `<tr><td>${escapeHtml(r.p.name)}${r.p.isGuest?' <span class="guestTag">Gast</span>':''}</td><td>${r.games}</td><td>${r.goalsAgainst}</td><td>${r.avg.toFixed(2)}</td><td>${r.shutouts}</td></tr>`).join('')}</tbody></table>
  ` : '<p class="muted">Keine Einsätze als TW für diese Filterauswahl.</p>';

  /* ---- Mitspieler-Kombinationen: mit wem der gewählte Spieler wie oft/lange zusammenspielte ---- */
  const teammateRowsAll = Object.entries(teammateStatsRaw).map(([id, s]) => {
    const p = state.players.find(x => x.id === id);
    return { p, id, shifts: s.shifts, minutes: s.minutes, goalsFor: s.goalsFor, goalsAgainst: s.goalsAgainst, plusMinus: s.plusMinus };
  }).filter(r => r.p);
  const teammateSort = getSort('auswTeammates', 'minutes', 'desc');
  const sortedTeammateRows = applySort(teammateRowsAll, teammateSort, {
    name: r => r.p.name, shifts: r => r.shifts, minutes: r => r.minutes, goalsFor: r => r.goalsFor, goalsAgainst: r => r.goalsAgainst, plusMinus: r => r.plusMinus,
  });
  const teammateTable = !af.statsPlayer ? '<p class="muted">Bitte oben einen Spieler auswählen, um zu sehen, mit wem er wie oft zusammengespielt hat.</p>'
    : (statsGames.length && sortedTeammateRows.length ? `
    <table id="auswTeammatesTable"><thead><tr>
      ${tableHeaderCell(teammateSort,'name','Mitspieler',{defaultDir:'asc'})}
      ${tableHeaderCell(teammateSort,'shifts','Einsätze',{width:'80px'})}
      ${tableHeaderCell(teammateSort,'minutes','Minuten',{width:'90px'})}
      ${tableHeaderCell(teammateSort,'plusMinus','+/-',{width:'70px'})}
      ${tableHeaderCell(teammateSort,'goalsFor','Tore',{width:'70px'})}
      ${tableHeaderCell(teammateSort,'goalsAgainst','Gegentore',{width:'90px'})}
    </tr></thead>
    <tbody>${sortedTeammateRows.map(r => `<tr><td>${escapeHtml(r.p.name)}${r.p.isGuest?' <span class="guestTag">Gast</span>':''}</td><td>${r.shifts}</td><td>${r.minutes.toFixed(1)}</td><td class="${r.plusMinus>0?'plusVal':r.plusMinus<0?'minusVal':''}">${r.plusMinus>0?'+':''}${r.plusMinus}</td><td>${r.goalsFor}</td><td>${r.goalsAgainst}</td></tr>`).join('')}</tbody></table>

  const co = af.collapsed || {};

  el.innerHTML = `

      </div>
      <div class="inlineForm filterBar">

            <option value="past" ${af.statsTimeFilter==='past'?'selected':''}>Vergangen (inkl. heute)</option>
            <option value="future" ${af.statsTimeFilter==='future'?'selected':''}>Zukünftig</option>

          <label>Typ</label>
          <select id="statsTypeFilter">
            <option value="">Meisterschaft &amp; Vorbereitung</option>
            <option value="meisterschaft" ${af.statsType==='meisterschaft'?'selected':''}>Meisterschaft</option>
            <option value="vorbereitung" ${af.statsType==='vorbereitung'?'selected':''}>Vorbereitung</option>
          </select>

          </select>

            <option value="">Alle Spieler</option>

  `;

  wireMdMultiSelect(el, 'resultsMd', seasonMds, 'resultsMatchdays', 'resultsMdOpen', renderAuswertungView);
  wireMdMultiSelect(el, 'statsMd', seasonMds, 'statsMatchdays', 'statsMdOpen', renderAuswertungView);

  el.querySelector('#resultsOppFilter').onchange = e => { state.auswertung.resultsOpponent = e.target.value; renderAuswertungView(); };
  el.querySelector('#statsTimeFilter').onchange = e => { state.auswertung.statsTimeFilter = e.target.value; renderAuswertungView(); };
  el.querySelector('#statsTypeFilter').onchange = e => { state.auswertung.statsType = e.target.value; renderAuswertungView(); };
  el.querySelector('#statsOppFilter').onchange = e => { state.auswertung.statsOpponent = e.target.value; renderAuswertungView(); };
  el.querySelector('#statsPlayerFilter').onchange = e => { state.auswertung.statsPlayer = e.target.value; renderAuswertungView(); };

  el.querySelectorAll('[data-collapse]').forEach(btn => {
    btn.onclick = () => {
      const key = btn.dataset.collapse;
      if(!state.auswertung.collapsed) state.auswertung.collapsed = {};
      state.auswertung.collapsed[key] = !state.auswertung.collapsed[key];
      renderAuswertungView();

/* ============================================================
   Sortierbare Tabellen (Klick auf Titelzeile)
   ============================================================ */
function getSort(tableId, defaultKey, defaultDir){
  if(!state.sortState[tableId]) state.sortState[tableId] = {key: defaultKey, dir: defaultDir||'desc'};
  return {...state.sortState[tableId], tableId};
}
function toggleSort(tableId, key, defaultDir){
  const cur = state.sortState[tableId];
  if(cur && cur.key===key){
    cur.dir = cur.dir==='asc' ? 'desc' : 'asc';
  } else {
    state.sortState[tableId] = {key, dir: defaultDir||'desc'};
  }
}
function applySort(rows, sort, accessors){
  const getter = accessors[sort.key];
  if(!getter) return rows;
  return rows.slice().sort((a,b) => {
    const av = getter(a), bv = getter(b);
    let cmp;
    if(typeof av === 'string') cmp = av.localeCompare(bv, 'de', {sensitivity:'base'});
    else cmp = (av||0) - (bv||0);
    return sort.dir==='asc' ? cmp : -cmp;
  });
}
function tableHeaderCell(sort, key, label, opts){
  opts = opts || {};
  const arrow = sort.key===key ? (sort.dir==='asc'?' ▲':' ▼') : '';
  const width = opts.width ? `width:${opts.width};` : '';
  const titleAttr = opts.title ? ` title="${escapeAttr(opts.title)}"` : '';
  return `<th data-sort-table="${sort.tableId}" data-sort-key="${key}" data-sort-default="${opts.defaultDir||'desc'}" style="${width}"${titleAttr}>${escapeHtml(label)}${arrow}</th>`;
}
function wireSortHeaders(root, rerenderFn){
  root.querySelectorAll('th[data-sort-table]').forEach(th => {
    th.onclick = () => {
      toggleSort(th.dataset.sortTable, th.dataset.sortKey, th.dataset.sortDefault);
      rerenderFn();
    };
  });
}

function critSelectOptions(selected, steps){

}
function renderCritForm(formId, scores, weights){

  EVAL_CATEGORIES.forEach(cat => {

}

function wireCritFormLive(formEl, weights){

  formEl.querySelectorAll('select[data-code]').forEach(sel => {

function averageScores(evaluations){
  const avg = {};
  EVAL_CRITERIA.forEach(c => {
    const vals = (evaluations||[]).map(e => e.scores ? e.scores[c.code] : undefined).filter(v => v!==undefined && v!==null && v!=='');
    if(vals.length){
      const mean = vals.reduce((a,b)=>a+Number(b),0) / vals.length;
      avg[c.code] = Math.round(mean*4)/4; // auf Viertel-Punkte (0.25-Schritte) runden
    }
  });
  return avg;
}
function critShort(c){ return c.code.replace(/^\d+\s*-\s*/,''); }
// Nicht editierbare Referenztabelle der Bewertungspunkte (Kürzel, Beschreibung, aktuelle Gewichtung der Saison) -
// wird sowohl im Haupttab (dort zusätzlich mit editierbaren Feldern) als auch pro Bewertungsrunde angezeigt.
function renderCriteriaRefTable(weights){
  return `
    <div style="overflow-x:auto;">

      <th>Kategorie</th><th>Kürzel</th><th>Beschreibung</th><th style="width:110px;">Gewichtung</th>
    </tr></thead>

      <tr>

        <td><strong>${escapeHtml(critShort(c))}</strong></td>
        <td><strong>${escapeHtml(c.aspect)}</strong><br><span class="muted">${escapeHtml(c.text)}</span></td>
        <td>${weightOf(c, weights)}</td>
      </tr>`).join('')}</tbody>
    </table>
    </div>
  `;
}
function fmtCritVal(v){
  if(v===undefined || v===null || v==='') return '–';
  return String(parseFloat(Number(v).toFixed(2)));
}
/* Ermittelt zu einem Satz Bewertungspunkt-Werte (scores: {code: Wert}) die Kürzel der
   Kriterien mit den besten bzw. schwächsten Noten, um sie in der Übersichtstabelle farblich
   hervorzuheben. Gleichstände werden dabei immer als ganze Gruppe behandelt: taucht die
   beste Note z.B. dreimal auf, werden genau diese drei hervorgehoben (die 3./x-te
   Gleichstands-Note "verbraucht" dabei den Platz, der sonst der zweitbesten Note
   zugestanden hätte) - es wird also nie in eine weitere, tiefere Note aufgefüllt, sobald
   die Gleichstandsgruppe bereits mindestens zwei Felder liefert. Nur falls die beste Note
   ein Einzelwert ist, wird zusätzlich die komplette Gruppe der zweitbesten Note
   hinzugenommen (und umgekehrt für die schwächsten Noten). */
function bestWorstCriteriaCodes(scores){
  const vals = EVAL_CRITERIA
    .map(c => ({code: c.code, v: scores ? scores[c.code] : undefined}))
    .filter(x => x.v!==undefined && x.v!==null && x.v!=='')
    .map(x => ({code: x.code, v: Math.round(Number(x.v)*100)/100}));

  const byValue = new Map();
  vals.forEach(x => {
    if(!byValue.has(x.v)) byValue.set(x.v, []);
    byValue.get(x.v).push(x.code);
  });

  // Nimmt, von sortedValues ausgehend, ganze Gleichstands-Gruppen auf, bis mindestens
  // 2 Felder erreicht sind (und bricht danach sofort ab - keine weitere Gruppe wird
  // angebrochen, auch wenn die letzte Gruppe die 2 überschritten hat).
  const pickGroups = (sortedValues) => {
    const codes = [];
    for(const v of sortedValues){
      codes.push(...byValue.get(v));
      if(codes.length >= 2) break;
    }
    return codes;
  };

  const ascValues = [...byValue.keys()].sort((a,b) => a-b);
  const descValues = ascValues.slice().reverse();

  const bestSet = new Set(pickGroups(descValues));
  const worstSet = new Set(pickGroups(ascValues));

  // Bei sehr wenigen unterschiedlichen Notenwerten können sich beste/schwächste
  // Gruppe überschneiden - überschneidende Felder werden dann als weder/noch belassen,
  // statt widersprüchlich doppelt eingefärbt zu werden.
  bestSet.forEach(c => { if(worstSet.has(c)){ bestSet.delete(c); worstSet.delete(c); } });

  return { best: bestSet, worst: worstSet };
}
function critValCell(code, scores, bw){
  const cls = bw.best.has(code) ? ' class="critBestCell"' : bw.worst.has(code) ? ' class="critWorstCell"' : '';
  return `<td${cls}>${fmtCritVal(scores[code])}</td>`;
}
function fmtDelta(v){
  if(v===undefined || v===null) return '–';
  const n = parseFloat(Number(v).toFixed(2));
  if(n===0) return '0';
  return (n>0?'+':'') + n;
}
function consolidationFor(roundId, playerId){
  const d = state.evalRoundsData[roundId] || {};
  return (d.consolidations||[]).find(c=>c.playerId===playerId) || null;
}
function evaluationFor(roundId, playerId, trainerUid){
  if(!trainerUid) return null;
  const d = state.evalRoundsData[roundId] || {};
  return (d.evaluations||[]).find(e=>e.playerId===playerId && e.trainerUid===trainerUid) || null;
}
// Liefert die eindeutigen Trainer (uid + Name), die in den angegebenen Runden mind. eine
// Bewertung abgegeben haben - für die Trainer-Filter im Haupttab bzw. pro Bewertungsrunde.
function getRoundTrainers(roundIds){
  const ids = Array.isArray(roundIds) ? roundIds : [roundIds];
  const map = {};
  ids.forEach(rid => {
    const d = state.evalRoundsData[rid] || {};
    (d.evaluations||[]).forEach(e => {
      if(e.trainerUid && !map[e.trainerUid]) map[e.trainerUid] = e.trainerName || 'Trainer';
    });
  });
  return Object.keys(map).map(uid => ({ uid, name: map[uid] })).sort((a,b)=>a.name.localeCompare(b.name,'de'));
}

function renderEvaluationView(){
  const el = document.getElementById('evaluationView');
  if(!el) return;

  if(!state.activeSeasonId){
    el.innerHTML = `<div class="card"><p class="muted">Bitte oben zuerst eine Saison anlegen bzw. auswählen.</p></div>`;
    return;
  }
  ensureAllEvalRoundsWatched();

  if(!state.openEvalRoundId){ renderEvalRoundsList(el); return; }
  const round = state.evalRounds.find(r=>r.id===state.openEvalRoundId);
  if(!round){
    // Runde ist (noch) nicht in state.evalRounds vorhanden - z.B. kurz nach dem Erstellen,
    // bevor der Firestore-Listener sie geliefert hat. state.openEvalRoundId NICHT zurücksetzen,
    // damit die Ansicht automatisch weitergeht, sobald die Daten eintreffen.
    el.innerHTML = `<div class="card"><p class="muted">Bewertungsrunde wird geladen…</p></div>`;
    return;
  }
  if(!state.openEvalPlayerId){ renderEvalRoundDetail(el, round); return; }
  const player = state.players.find(p=>p.id===state.openEvalPlayerId);
  if(!player){ state.openEvalPlayerId=null; renderEvalRoundDetail(el, round); return; }
  renderEvalPlayerPanel(el, round, player);
}

function evalSquad(){
  return state.players
    .filter(p => p.seasonId===state.activeSeasonId && !p.isGuest && p.active!==false)
    .slice().sort((a,b)=>(a.number||0)-(b.number||0));
}

function renderEvalRoundsList(el){
  const activeSeason = state.seasons.find(s=>s.id===state.activeSeasonId);
  const seasonLabel = activeSeason ? activeSeason.label : '–';
  const rounds = sortEvalRoundsChronological(state.evalRounds.filter(r=>r.seasonId===state.activeSeasonId));
  const squad = evalSquad();
  const defaultLabel = `${rounds.length+1}. Bewertung`;
  const ec = state.evalCollapsed || {};
  const weights = getActiveWeights();

  const roundItems = rounds.map(r => {
    const data = state.evalRoundsData[r.id] || {};
    const consolidations = data.consolidations || [];
    const consolidatedCount = squad.filter(p => consolidations.some(c=>c.playerId===p.id)).length;
    if(state.editingRoundId === r.id){
      return `
        <div class="matchdayItemEdit" data-edit-id="${r.id}">
          <div class="inlineForm">
            <div class="field"><label>Bezeichnung</label><input type="text" id="editRoundLabel" value="${escapeAttr(r.label||'')}"></div>
            <div class="field"><label>Datum</label><input type="text" id="editRoundDate" placeholder="TT.MM.JJJJ" value="${escapeAttr(r.date||'')}"></div>
            <button class="btn" data-act="saveround" data-id="${r.id}">Speichern</button>
            <button class="btn ghost" data-act="canceledit">Abbrechen</button>
          </div>
        </div>`;
    }
    return `
      <div class="matchdayItem" data-id="${r.id}">
        <div>
          <strong>${escapeHtml(r.label || 'Bewertungsrunde')}</strong>
          <div class="meta">${r.date?escapeHtml(r.date)+' · ':''}${consolidatedCount} / ${squad.length} Spieler konsolidiert</div>
        </div>
        <div>
          <button class="iconBtn editIcon" data-act="editround" data-id="${r.id}" title="Bearbeiten">✎</button>
          <button class="iconBtn" data-act="delround" data-id="${r.id}" title="Löschen">✕</button>
        </div>
      </div>`;
  }).join('');

  /* ---- Spieler-Filter: gilt für alle Tabellen dieser Ansicht (Gesamtnote je Runde,
         Übersicht, Entwicklung), damit eine einzige Auswahl überall konsistent filtert. ---- */
  const mf = state.evalMainFilters;
  if(mf.playerId && !squad.some(p=>p.id===mf.playerId)) mf.playerId = '';
  const mainPlayers = mf.playerId ? squad.filter(p=>p.id===mf.playerId) : squad;

  const summaryTable = mainPlayers.length ? `
    <table><thead><tr><th>Spieler</th>${rounds.length ? rounds.map(r=>`<th>${escapeHtml(r.label||'Bewertung')}</th>`).join('') : '<th class="muted">–</th>'}</tr></thead>
    <tbody>${mainPlayers.map(p => {
      const cells = rounds.length ? rounds.map(r => {
        const c = consolidationFor(r.id, p.id);
        const total = c ? computeWeightedTotal(c.scores, weights) : null;
        return `<td>${fmtScore(total)}</td>`;
      }).join('') : '<td class="muted">–</td>';
      return `<tr><td>${escapeHtml(p.name)}</td>${cells}</tr>`;
    }).join('')}</tbody></table>
  ` : '<p class="muted">Kein Kader für diese Saison erfasst.</p>';

  const playerFilterSelect = (id) => `<div class="field"><label>Spieler</label><select id="${id}"><option value="">Alle Spieler</option>${squad.map(p=>`<option value="${p.id}" ${mf.playerId===p.id?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}</select></div>`;

  /* ---- Übersicht: alle Bewertungspunkte, alle Spieler – Durchschnitt über alle Runden
         (oder, bei Filterung, nur die gewählte Runde), filterbar nach Spieler/Runde/Trainer.
         Ohne Trainer-Filter werden die konsolidierten (offiziellen) Werte gezeigt, mit
         Trainer-Filter stattdessen die individuellen Bewertungen dieses Trainers. ---- */
  const filterRoundId = mf.roundId && rounds.some(r=>r.id===mf.roundId) ? mf.roundId : '';
  const mainTrainers = getRoundTrainers(rounds.map(r=>r.id));
  if(mf.trainerId && !mainTrainers.some(t=>t.uid===mf.trainerId)) mf.trainerId = '';
  const filterTrainerId = mf.trainerId;

  const scoresSourceFor = (roundId, playerId) => filterTrainerId ? evaluationFor(roundId, playerId, filterTrainerId) : consolidationFor(roundId, playerId);

  const mainOverviewRows = mainPlayers.map(p => {
    let scores, avg;
    if(filterRoundId){
      const s = scoresSourceFor(filterRoundId, p.id);
      scores = s ? (s.scores||{}) : {};
      avg = s ? computeWeightedTotal(scores, weights) : null;
    } else {
      scores = {};
      EVAL_CRITERIA.forEach(crit => {
        const vals = rounds.map(r => { const s = scoresSourceFor(r.id, p.id); return s && s.scores ? s.scores[crit.code] : undefined; })
          .filter(v => v!==undefined && v!==null && v!=='');
        if(vals.length) scores[crit.code] = vals.reduce((a,b)=>a+Number(b),0) / vals.length;
      });
      avg = Object.keys(scores).length ? computeWeightedTotal(scores, weights) : null;
    }
    return { p, scores, avg };
  });
  const mainSort = getSort('evalMainOverview', 'avg', 'desc');
  const mainAccessors = { name: r => r.p.name, avg: r => r.avg===null ? -1 : r.avg };
  EVAL_CRITERIA.forEach(c => { mainAccessors[c.code] = r => (r.scores[c.code]===undefined || r.scores[c.code]===null) ? -1 : Number(r.scores[c.code]); });
  const sortedMainRows = applySort(mainOverviewRows, mainSort, mainAccessors);

  const mainOverviewTable = squad.length ? (rounds.length ? `
    <div style="overflow-x:auto;">
    <table id="evalMainOverviewTable"><thead><tr>
      ${tableHeaderCell(mainSort,'name','Spieler',{defaultDir:'asc'})}

      ${tableHeaderCell(mainSort,'avg','Ø',{width:'64px', title:'Gewichtete Gesamtnote'})}
    </tr></thead>
    <tbody>${sortedMainRows.map(r => { const bw = bestWorstCriteriaCodes(r.scores); return `
      <tr>
        <td>${escapeHtml(r.p.name)}</td>
        ${EVAL_CRITERIA.map(c => critValCell(c.code, r.scores, bw)).join('')}
        <td><strong>${fmtScore(r.avg)}</strong></td>
      </tr>`; }).join('')}</tbody>
    </table>
    </div>
  ` : '<p class="muted">Noch keine Bewertungsrunde vorhanden.</p>') : '<p class="muted">Kein Kader für diese Saison erfasst.</p>';

  /* ---- Entwicklung zwischen zwei Bewertungsrunden (Standard: erste vs. letzte Runde,
         solange der Trainer nicht manuell eine andere Kombination gewählt hat) ---- */
  if(rounds.length){
    if(!state.evalCompareManual){
      state.evalCompareFromId = rounds[0].id;
      state.evalCompareToId = rounds[rounds.length-1].id;
    } else {
      if(!state.evalCompareFromId || !rounds.some(r=>r.id===state.evalCompareFromId)) state.evalCompareFromId = rounds[0].id;
      if(!state.evalCompareToId || !rounds.some(r=>r.id===state.evalCompareToId)) state.evalCompareToId = rounds[rounds.length-1].id;
    }
  }
  const fromRound = rounds.find(r=>r.id===state.evalCompareFromId);
  const toRound = rounds.find(r=>r.id===state.evalCompareToId);

  const devRows = mainPlayers.map(p => {
    const cFrom = fromRound ? consolidationFor(fromRound.id, p.id) : null;
    const cTo = toRound ? consolidationFor(toRound.id, p.id) : null;
    const deltas = {};
    EVAL_CRITERIA.forEach(c => {
      const vFrom = cFrom && cFrom.scores ? cFrom.scores[c.code] : undefined;
      const vTo = cTo && cTo.scores ? cTo.scores[c.code] : undefined;
      if(vFrom!==undefined && vFrom!==null && vTo!==undefined && vTo!==null){
        deltas[c.code] = Number(vTo) - Number(vFrom);
      }
    });
    const avgFrom = cFrom ? computeWeightedTotal(cFrom.scores, weights) : null;
    const avgTo = cTo ? computeWeightedTotal(cTo.scores, weights) : null;
    const avgDelta = (avgFrom!==null && avgTo!==null) ? avgTo - avgFrom : null;
    return { p, deltas, avgDelta };
  });
  const devSort = getSort('evalDevelopment', 'avgDelta', 'desc');
  const devAccessors = { name: r => r.p.name, avgDelta: r => r.avgDelta===null ? -999 : r.avgDelta };
  EVAL_CRITERIA.forEach(c => { devAccessors[c.code] = r => (r.deltas[c.code]===undefined ? -999 : r.deltas[c.code]); });
  const sortedDevRows = applySort(devRows, devSort, devAccessors);

  const devSelects = rounds.length ? `
    <div class="inlineForm filterBar" style="margin-bottom:14px;">
      <div class="field"><label>Von Runde</label><select id="evalCompareFrom">${rounds.map(r=>`<option value="${r.id}" ${state.evalCompareFromId===r.id?'selected':''}>${escapeHtml(r.label||'Bewertungsrunde')}</option>`).join('')}</select></div>
      <div class="field"><label>Bis Runde</label><select id="evalCompareTo">${rounds.map(r=>`<option value="${r.id}" ${state.evalCompareToId===r.id?'selected':''}>${escapeHtml(r.label||'Bewertungsrunde')}</option>`).join('')}</select></div>
    </div>
  ` : '';

  const devTable = !rounds.length ? '<p class="muted">Noch keine Bewertungsrunde vorhanden.</p>'
    : !mainPlayers.length ? '<p class="muted">Kein Kader für diese Saison erfasst.</p>'
    : `
    <div style="overflow-x:auto;">
    <table id="evalDevelopmentTable"><thead><tr>
      ${tableHeaderCell(devSort,'name','Spieler',{defaultDir:'asc'})}
      ${EVAL_CRITERIA.map(c => tableHeaderCell(devSort, c.code, critShort(c), {width:'56px', title: `${c.aspect} (Gewicht ${weightOf(c, weights)})`})).join('')}
      ${tableHeaderCell(devSort,'avgDelta','Ø',{width:'64px', title:'Differenz der gewichteten Gesamtnote'})}
    </tr></thead>
    <tbody>${sortedDevRows.map(r => `
      <tr>
        <td>${escapeHtml(r.p.name)}</td>
        ${EVAL_CRITERIA.map(c => { const v=r.deltas[c.code]; return `<td class="${v>0?'plusVal':v<0?'minusVal':''}">${fmtDelta(v)}</td>`; }).join('')}
        <td class="${r.avgDelta>0?'plusVal':r.avgDelta<0?'minusVal':''}"><strong>${fmtDelta(r.avgDelta)}</strong></td>
      </tr>`).join('')}</tbody>
    </table>
    </div>
  `;

  const criteriaTable = `
    <div style="overflow-x:auto;">
    <table id="evalCriteriaTable"><thead><tr>
      <th>Kategorie</th><th>Kürzel</th><th>Beschreibung</th><th style="width:110px;">Gewichtung</th>
    </tr></thead>
    <tbody>${EVAL_CRITERIA.map(c => `
      <tr>
        <td>${escapeHtml(c.category)}</td>
        <td><strong>${escapeHtml(critShort(c))}</strong></td>
        <td><strong>${escapeHtml(c.aspect)}</strong><br><span class="muted">${escapeHtml(c.text)}</span></td>
        <td><input type="number" min="0" step="0.5" data-weight-code="${escapeAttr(c.code)}" value="${weightOf(c, weights)}" style="width:70px;"></td>
      </tr>`).join('')}</tbody>
    </table>
    </div>
    <p class="muted" style="margin:10px 0 0;">Die Gewichtung gilt nur für die Saison ${escapeHtml(seasonLabel)} und beeinflusst die gewichtete Gesamtnote in allen Tabellen dieser Saison.</p>
    <div style="margin-top:10px;">
      <button class="btn" id="saveWeightsBtn">Gewichtung speichern</button>
      <button class="btn ghost" id="resetWeightsBtn" style="margin-left:8px;">Auf Standard zurücksetzen</button>
    </div>
  `;

  el.innerHTML = `
    <div class="card">
      <div class="cardHead"><h2>Bewertung <span class="muted" style="font-weight:400;">– Saison ${escapeHtml(seasonLabel)}</span></h2></div>
      <p class="muted" style="margin-top:-6px;">Bewertungsraster (TTPP SwissUnihockey) zur Verfolgung der Spielerentwicklung – üblicherweise bis zu 3 Runden pro Saison.</p>
      <div class="inlineForm" style="margin-bottom:16px;">
        <div class="field"><label>Bezeichnung</label><input type="text" id="newRoundLabel" placeholder="${escapeAttr(defaultLabel)}"></div>
        <div class="field"><label>Datum</label><input type="text" id="newRoundDate" placeholder="TT.MM.JJJJ"></div>
        <button class="btn" id="addRoundBtn">+ Neue Bewertungsrunde</button>
      </div>
      <div class="matchdayList">${roundItems || '<p class="muted">Noch keine Bewertungsrunde erfasst.</p>'}</div>

function renderEvalRoundDetail(el, round){
  const squad = evalSquad();
  const weights = getActiveWeights();
  const data = state.evalRoundsData[round.id] || {};
  const evaluations = data.evaluations || [];
  const consolidations = data.consolidations || [];

  /* ---- Spieler-Filter: gilt für alle Tabellen dieser Bewertungsrunde ---- */
  const rf = state.evalRoundFilters || (state.evalRoundFilters = { trainerId: '', playerId: '' });
  if(rf.playerId && !squad.some(p=>p.id===rf.playerId)) rf.playerId = '';
  const roundPlayers = rf.playerId ? squad.filter(p=>p.id===rf.playerId) : squad;
  const roundPlayerFilterSelect = (id) => `<div class="field"><label>Spieler</label><select id="${id}"><option value="">Alle Spieler</option>${squad.map(p=>`<option value="${p.id}" ${rf.playerId===p.id?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}</select></div>`;

  /* ---- Zeilenliste: Spieler auswählen, um Bewertung zu erfassen/konsolidieren ---- */
  const rows = roundPlayers.map(p => {
    const evals = evaluations.filter(e=>e.playerId===p.id);
    const consolidation = consolidations.find(c=>c.playerId===p.id);
    let badge;
    if(consolidation) badge = `<span class="evalStatusBadge done">Konsolidiert</span>`;
    else if(evals.length) badge = `<span class="evalStatusBadge partial">${evals.length} Trainer-Bewertung${evals.length===1?'':'en'}</span>`;
    else badge = `<span class="evalStatusBadge none">Offen</span>`;
    return `<tr class="evalPlayerRow" data-id="${p.id}"><td style="width:50px;">${p.number ?? '–'}</td><td>${escapeHtml(p.name)}</td><td style="width:170px;">${badge}</td></tr>`;
  }).join('');

  /* ---- Übersichtstabelle: alle Bewertungspunkte + Gesamtdurchschnitt, sortierbar.
         Standardmässig konsolidiert; per Trainer-Filter stattdessen dessen individuelle Bewertungen. ---- */
  const roundTrainers = getRoundTrainers(round.id);
  if(rf.trainerId && !roundTrainers.some(t=>t.uid===rf.trainerId)) rf.trainerId = '';
  const overviewRows = roundPlayers.map(p => {
    const source = rf.trainerId ? evaluationFor(round.id, p.id, rf.trainerId) : consolidations.find(c=>c.playerId===p.id);
    const scores = source ? (source.scores||{}) : {};
    const avg = source ? computeWeightedTotal(scores, weights) : null;
    return { p, scores, avg };
  });
  const overviewSort = getSort('evalOverview', 'avg', 'desc');
  const overviewAccessors = { name: r => r.p.name, avg: r => r.avg===null ? -1 : r.avg };
  EVAL_CRITERIA.forEach(c => { overviewAccessors[c.code] = r => (r.scores[c.code]===undefined || r.scores[c.code]===null) ? -1 : Number(r.scores[c.code]); });
  const sortedOverviewRows = applySort(overviewRows, overviewSort, overviewAccessors);
  const overviewTable = roundPlayers.length ? `
    <div style="overflow-x:auto;">
    <table id="evalOverviewTable"><thead><tr>
      ${tableHeaderCell(overviewSort,'name','Spieler',{defaultDir:'asc'})}
      ${EVAL_CRITERIA.map(c => tableHeaderCell(overviewSort, c.code, critShort(c), {width:'56px', title: `${c.aspect} (Gewicht ${weightOf(c, weights)})`})).join('')}
      ${tableHeaderCell(overviewSort,'avg','Ø',{width:'64px', title:'Gewichtete Gesamtnote'})}
    </tr></thead>
    <tbody>${sortedOverviewRows.map(r => { const bw = bestWorstCriteriaCodes(r.scores); return `
      <tr>
        <td>${escapeHtml(r.p.name)}</td>
        ${EVAL_CRITERIA.map(c => critValCell(c.code, r.scores, bw)).join('')}
        <td><strong>${fmtScore(r.avg)}</strong></td>
      </tr>`; }).join('')}</tbody>
    </table>
    </div>
  ` : '<p class="muted">Kein Kader für diese Saison erfasst.</p>';

  const ec = state.evalCollapsed || {};

  el.innerHTML = `
    <div class="card">
      <div class="cardHead">
        <div><button class="btn ghost" id="backToRoundsBtn">← Bewertungsrunden</button></div>
        <h2>${escapeHtml(round.label||'Bewertungsrunde')} <span class="muted">${round.date||''}</span></h2>
      </div>
      <p class="muted" style="margin-top:-6px;">Spieler auswählen, um die Bewertung zu erfassen bzw. zu konsolidieren.</p>
      <div class="inlineForm filterBar" style="margin-bottom:14px;">${roundPlayerFilterSelect('evalRoundFilterPlayerList')}</div>
      <table><tbody>${rows || '<tr><td class="muted">Kein Kader für diese Saison erfasst.</td></tr>'}</tbody></table>
    </div>

    <div class="card">
      <div class="cardHead">
        <h3>Bewertungspunkte – Kürzel &amp; Beschreibung</h3>
        <button type="button" class="collapseToggle" data-collapse="roundCriteria">${ec.roundCriteria ? 'Anzeigen ▾' : 'Verbergen ▴'}</button>
      </div>
      ${ec.roundCriteria ? '' : renderCriteriaRefTable(weights)}
    </div>

    <div class="card">
      <div class="cardHead"><h3>Übersicht – alle Bewertungspunkte ${rf.trainerId ? '' : '(konsolidiert)'}</h3></div>
      <div class="inlineForm filterBar" style="margin-bottom:14px;">
        ${roundPlayerFilterSelect('evalRoundFilterPlayerOverview')}
        <div class="field"><label>Trainer</label><select id="evalRoundFilterTrainer"><option value="">Konsolidiert (alle Trainer)</option>${roundTrainers.map(t=>`<option value="${t.uid}" ${rf.trainerId===t.uid?'selected':''}>${escapeHtml(t.name)}</option>`).join('')}</select></div>
      </div>
      ${rf.trainerId ? `<p class="muted" style="margin-top:-6px;">Zeigt die individuellen Bewertungen von <strong>${escapeHtml((roundTrainers.find(t=>t.uid===rf.trainerId)||{}).name||'')}</strong> – nicht die konsolidierte Bewertung.</p>` : ''}
      ${overviewTable}
    </div>
  `;

  el.querySelector('#backToRoundsBtn').onclick = () => { state.openEvalRoundId=null; state.openEvalPlayerId=null; renderEvaluationView(); };
  el.querySelectorAll('.evalPlayerRow').forEach(row => {
    row.onclick = () => { state.openEvalPlayerId = row.dataset.id; renderEvaluationView(); };
  });
  const overviewTableEl = el.querySelector('#evalOverviewTable');
  if(overviewTableEl) wireSortHeaders(overviewTableEl, () => renderEvaluationView());
  const roundFilterTrainerEl = el.querySelector('#evalRoundFilterTrainer');
  if(roundFilterTrainerEl) roundFilterTrainerEl.onchange = e => { state.evalRoundFilters.trainerId = e.target.value; renderEvaluationView(); };
  el.querySelectorAll('#evalRoundFilterPlayerList, #evalRoundFilterPlayerOverview').forEach(sel => {
    sel.onchange = e => { state.evalRoundFilters.playerId = e.target.value; renderEvaluationView(); };
  });
  el.querySelectorAll('[data-collapse]').forEach(btn => {
    btn.onclick = () => {
      const key = btn.dataset.collapse;
      if(!state.evalCollapsed) state.evalCollapsed = {};
      state.evalCollapsed[key] = !state.evalCollapsed[key];
      renderEvaluationView();
    };
  });
}
